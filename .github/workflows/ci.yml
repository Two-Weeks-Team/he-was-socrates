name: CI

# Triggers: PRs to main and pushes to main.
# Runner: macos-26 (Tahoe, Apple Silicon arm64). Required after SPEC iter6
#         raised the deployment floor to macOS 26 — older runners (macos-15
#         and below) cannot load the test xctest bundle because it's linked
#         against macOS 26 Swift dylibs (libswift_DarwinFoundation1.dylib).
#         See: https://github.com/actions/runner-images for available labels.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel any in-progress run for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Pin Apple's swift-format release that pairs with Swift 6.1.
  SWIFT_FORMAT_VERSION: "601.0.0"
  GITLEAKS_VERSION: "8.21.2"

jobs:
  # -------------------------------------------------------------------------
  # 1) Build the Python venv + asset pipeline + Swift Package + the full
  #    swift-testing suite (62 tests at the time of writing, but the count
  #    drifts as PRs land — the job runs `make engine-test` which executes
  #    the entire suite, so the number in this comment is informational only).
  # -------------------------------------------------------------------------
  engine-build-and-test:
    name: Engine build & swift-testing suite
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode (Swift 6.1+ required by mlx-swift-lm 3.31.3)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          python3 --version

      - name: Cache Python venv (.venv-build)
        id: cache-venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv-build
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-pillow-numpy-v1
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Cache SwiftPM (~/.swiftpm + .build)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.swiftpm
            packages/SocraticEngine/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('packages/SocraticEngine/Package.swift', 'packages/SocraticEngine/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Build asset pipeline (make assets)
        run: make assets

      - name: Run swift-testing suite (make engine-test)
        run: make engine-test

  # -------------------------------------------------------------------------
  # 2) Determinism guard — re-running make assets must produce a byte-identical
  #    manifest. Fails on any drift.
  # -------------------------------------------------------------------------
  assets-determinism:
    name: Asset pipeline determinism
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Python venv (.venv-build)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv-build
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-pillow-numpy-v1
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Build assets (initial)
        run: make assets

      - name: Verify deterministic rebuild (make assets-verify)
        run: make assets-verify

  # -------------------------------------------------------------------------
  # 3) Lint Swift sources with Apple's swift-format. Errors fail the job;
  #    warnings are tolerated for now.
  # -------------------------------------------------------------------------
  lint-swift:
    name: swift-format lint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install swift-format via Homebrew
        run: |
          # Homebrew swift-format tracks Apple's main-line releases and is
          # the most reliable source on hosted runners.
          brew install swift-format
          swift-format --version

      - name: Lint packages, apps, tools (errors only)
        run: |
          # --strict elevates lint findings to non-zero exit code on errors.
          # We deliberately do NOT use --strict yet (we accept warnings) but
          # rely on the default exit-on-error semantics.
          swift-format lint -r packages apps tools

  # -------------------------------------------------------------------------
  # 4) Secret scanning with gitleaks (committed secrets). Fail on any leak.
  # -------------------------------------------------------------------------
  security-scan:
    name: gitleaks secret scan
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Checkout repository (full history for gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks via Homebrew
        run: |
          brew install gitleaks
          gitleaks version

      - name: Run gitleaks (uses .gitleaks.toml at repo root)
        run: gitleaks detect --no-banner --source . --redact

  # -------------------------------------------------------------------------
  # 5) Build-time test oracles (Rhubarb + g2pK) install smoke per
  #    viseme-best-practices.md §7.7. Confirms the install script keeps
  #    working as the GitHub Actions environment evolves; doesn't require
  #    the oracles for any other gate, just guards the install path.
  # -------------------------------------------------------------------------
  install-oracles-smoke:
    name: install-oracles smoke
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run install-oracles (Rhubarb + g2pK)
        # ORACLES_SKIP_G2PK=1 because the runner doesn't have the Korean
        # MeCab dictionaries pre-installed and `pip install g2pk` would
        # need ~5 minutes of extra brew setup. Rhubarb (the en-US
        # build-time oracle) is the path that actually drifts; we
        # validate it here.
        run: ORACLES_SKIP_G2PK=1 make install-oracles

      - name: Verify Rhubarb binary
        run: |
          test -x tools/oracles/rhubarb-1.14.0/rhubarb
          tools/oracles/rhubarb-1.14.0/rhubarb --version

      - name: Sanity-check apple-phoneme-availability.json shape
        # PR-ζ guard against empirical-probe artifact drift. The iter5
        # SPEC delta + TTSManager pipeline comments depend on this JSON
        # always carrying `verdict`, `voices`, and `fixtures` keys; if a
        # contributor commits a malformed update this catches it.
        run: |
          set -e
          FILE=runs/2026-05-05-spec/spec/apple-phoneme-availability.json
          test -f "$FILE"
          python3 -m json.tool "$FILE" >/dev/null
          jq -e '.verdict and .voices and .fixtures' "$FILE" >/dev/null
          echo "✓ apple-phoneme-availability.json shape ok"

  # -------------------------------------------------------------------------
  # 6) LatencyBench compile-only smoke. PR-λ added an executable target
  #    (`tools/LatencyBench`) that loads the real Gemma 4 weights through
  #    the same call paths the app uses and prints decode wall-clock per
  #    turn. Running the bench requires 4 GB of staged weights, which CI
  #    won't have — but the *compile* step still needs to succeed, otherwise
  #    a future PR can break the bench tool without anyone noticing until
  #    the next time someone tries to reproduce the latency floor claim.
  #
  #    This job catches that drift early. It is intentionally compile-only.
  #    The Makefile's `bench-latency` target handles the live-run side
  #    (sandbox HF cache + metallib colocation) for local reproducibility.
  # -------------------------------------------------------------------------
  bench-latency-compile:
    name: LatencyBench compile-only smoke
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode (Swift 6.1+ required by mlx-swift-lm)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM (~/.swiftpm + .build)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.swiftpm
            packages/SocraticEngine/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('packages/SocraticEngine/Package.swift', 'packages/SocraticEngine/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Build LatencyBench (release, no run)
        run: make bench-latency-build

      - name: Confirm binary exists
        # If a future PR removes the executable target without removing the
        # Makefile alias, `swift build` exits 0 but no binary is produced.
        # This step makes that an explicit failure.
        run: test -x packages/SocraticEngine/.build/release/LatencyBench
