name: CI

# Triggers: PRs to main and pushes to main.
# Runner: macOS 14 (Sonoma) on Apple Silicon when available; falls back to
#         GitHub-hosted macos-14 (currently still primarily Apple-Silicon as
#         of 2026-05). If that label changes, document a swap to macos-latest.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel any in-progress run for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Pin Apple's swift-format release that pairs with Swift 6.1.
  SWIFT_FORMAT_VERSION: "601.0.0"
  GITLEAKS_VERSION: "8.21.2"

jobs:
  # -------------------------------------------------------------------------
  # 1) Build the Python venv + asset pipeline + Swift Package + 41 tests.
  # -------------------------------------------------------------------------
  engine-build-and-test:
    name: Engine build & 41 swift-testing scenarios
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode (Swift 6.1+ required by mlx-swift-lm 3.31.3)
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          python3 --version

      - name: Cache Python venv (.venv-build)
        id: cache-venv
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .venv-build
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-pillow-numpy-v1
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Cache SwiftPM (~/.swiftpm + .build)
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.swiftpm
            packages/SocraticEngine/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('packages/SocraticEngine/Package.swift', 'packages/SocraticEngine/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Build asset pipeline (make assets)
        run: make assets

      - name: Run swift-testing suite (make engine-test)
        run: make engine-test

  # -------------------------------------------------------------------------
  # 2) Determinism guard — re-running make assets must produce a byte-identical
  #    manifest. Fails on any drift.
  # -------------------------------------------------------------------------
  assets-determinism:
    name: Asset pipeline determinism
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache Python venv (.venv-build)
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .venv-build
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-pillow-numpy-v1
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Build assets (initial)
        run: make assets

      - name: Verify deterministic rebuild (make assets-verify)
        run: make assets-verify

  # -------------------------------------------------------------------------
  # 3) Lint Swift sources with Apple's swift-format. Errors fail the job;
  #    warnings are tolerated for now.
  # -------------------------------------------------------------------------
  lint-swift:
    name: swift-format lint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install swift-format via Homebrew
        run: |
          # Homebrew swift-format tracks Apple's main-line releases and is
          # the most reliable source on macos-14 runners.
          brew install swift-format
          swift-format --version

      - name: Lint packages, apps, tools (errors only)
        run: |
          # --strict elevates lint findings to non-zero exit code on errors.
          # We deliberately do NOT use --strict yet (we accept warnings) but
          # rely on the default exit-on-error semantics.
          swift-format lint -r packages apps tools

  # -------------------------------------------------------------------------
  # 4) Secret scanning with gitleaks (committed secrets). Fail on any leak.
  # -------------------------------------------------------------------------
  security-scan:
    name: gitleaks secret scan
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Checkout repository (full history for gitleaks)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks via Homebrew
        run: |
          brew install gitleaks
          gitleaks version

      - name: Run gitleaks (uses .gitleaks.toml at repo root)
        run: gitleaks detect --no-banner --source . --redact
