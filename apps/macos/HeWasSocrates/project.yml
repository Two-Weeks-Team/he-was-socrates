name: HeWasSocrates

options:
  bundleIdPrefix: com.twoweeks
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

# Bundle ID is canonicalized to `com.twoweeks.hewassocrates` per
# runs/2026-05-05-spec/spec/entitlements.plist.md and error-catalog.md.
# Per-developer DEVELOPMENT_TEAM lives in Local.xcconfig (gitignored);
# Config.xcconfig is the committed default with an optional #include?.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    # PR-κ F15: bumped from "5.9" to "6.1" so the app target compiles
    # under the same strict-concurrency mode as the SocraticEngine
    # package (Package.swift declares swift-tools-version: 6.1 and
    # SWIFT_STRICT_CONCURRENCY: complete). Mismatched modes silently
    # demote engine warnings to compile-time accepts in the app target,
    # which masks real Sendable violations. Apple Swift evolution
    # guidance + Swift Forums consensus is to align language modes
    # across the same workspace once the engine is on 6.1.
    SWIFT_VERSION: "6.1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    PRODUCT_BUNDLE_IDENTIFIER: com.twoweeks.hewassocrates
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    OTHER_LDFLAGS: "-ObjC"

packages:
  SocraticEngine:
    path: ../../../packages/SocraticEngine

targets:
  HeWasSocrates:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: HeWasSocrates
        excludes:
          - "Resources/Info.plist"
          - "Resources/HeWasSocrates.entitlements"
      # Repo-level assets — pulled into Copy Resources via buildPhase: resources.
      # The previous `resources:` block was silently dropped by xcodegen 2.44.1
      # when combined with `destinationFilters` + external paths, leaving the
      # .app without face_halftone.png / visemes/ at runtime.
      - path: ../../../assets/face_halftone.png
        buildPhase: resources
      - path: ../../../assets/visemes
        buildPhase: resources
    # NOTE: do NOT add `info:` or `entitlements:` blocks here. xcodegen 2.44.1
    # treats those as WRITE specifications and overwrites the committed files
    # with an empty `<dict/>`. The existing files are authored under
    # runs/2026-05-05-spec/spec/entitlements.plist.md and must be preserved
    # verbatim. We point INFOPLIST_FILE / CODE_SIGN_ENTITLEMENTS at them via
    # build settings (below) so xcodegen only references, never rewrites.
    dependencies:
      - package: SocraticEngine
        product: SocraticEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HeWasSocrates/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HeWasSocrates/Resources/HeWasSocrates.entitlements

  HeWasSocratesTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - HeWasSocratesTests
    dependencies:
      - target: HeWasSocrates
      - package: SocraticEngine
        product: SocraticEngine

schemes:
  HeWasSocrates:
    build:
      targets:
        HeWasSocrates: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - HeWasSocratesTests
