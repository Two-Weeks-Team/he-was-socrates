name: HeWasSocrates

options:
  bundleIdPrefix: engineering.twoweeks
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    PRODUCT_BUNDLE_IDENTIFIER: engineering.twoweeks.HeWasSocrates
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    OTHER_LDFLAGS: "-ObjC"

packages:
  SocraticEngine:
    path: ../../../packages/SocraticEngine

targets:
  HeWasSocrates:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: HeWasSocrates
        excludes:
          - "Resources/Info.plist"
          - "Resources/HeWasSocrates.entitlements"
    resources:
      - path: HeWasSocrates/Resources
        excludes:
          - "Info.plist"
          - "HeWasSocrates.entitlements"
      # Viseme PNGs come from repo-level assets/ directory, copied at build time.
      - path: ../../../assets/face_halftone.png
        destinationFilters: [macOS]
      - path: ../../../assets/visemes
        destinationFilters: [macOS]
        type: folder
    info:
      path: HeWasSocrates/Resources/Info.plist
      properties: {}
    entitlements:
      path: HeWasSocrates/Resources/HeWasSocrates.entitlements
    dependencies:
      - package: SocraticEngine
        product: SocraticEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HeWasSocrates/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HeWasSocrates/Resources/HeWasSocrates.entitlements

  HeWasSocratesTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - HeWasSocratesTests
    dependencies:
      - target: HeWasSocrates
      - package: SocraticEngine
        product: SocraticEngine

schemes:
  HeWasSocrates:
    build:
      targets:
        HeWasSocrates: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - HeWasSocratesTests
